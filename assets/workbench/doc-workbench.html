<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文字工作台</title>
  <link rel="stylesheet" href="/doc-workbench.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" width="24" height="24" viewBox="16 16 68 68" role="img" aria-label="Logics" focusable="false">
        <path d="M20 25.5 A3.5 3.5 0 0 1 23.5 22 H33.5 A3.5 3.5 0 0 1 37 25.5 V59 H54.5 A3.5 3.5 0 0 1 58 62.5 V72.5 A3.5 3.5 0 0 1 54.5 76 H20 Z" fill="currentColor"/>
        <circle cx="55" cy="42" r="14.5" fill="var(--logics-accent, #E24B2B)"/>
        <circle cx="70" cy="68" r="7" fill="currentColor"/>
      </svg>
      <div class="doc-meta">
        <strong id="projectName">工作稿</strong>
        <span class="doc-kind" id="docKind"></span>
      </div>
    </div>
    <div class="top-actions">
      <span class="save-state" id="saveState" role="status" aria-live="polite">正在打开…</span>
      <button type="button" class="structure-dot" id="structureDot" aria-label="结构提示" title="结构提示" aria-expanded="false" aria-controls="structurePanel" hidden></button>
      <div class="structure-panel" id="structurePanel" role="dialog" aria-label="结构提示" hidden>
        <div class="structure-panel-list" id="structureList"></div>
      </div>
      <button type="button" class="topbar-toggle" id="tocCollapse" data-collapse="toc" aria-expanded="true" aria-controls="tocPanel" aria-label="收起目录" title="收起目录">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/>
        </svg>
      </button>
      <button type="button" class="topbar-toggle" id="notesCollapse" data-collapse="notes" aria-expanded="true" aria-controls="notesPanel" aria-label="收起批注" title="收起批注">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/><path d="m8 9 3 3-3 3"/>
        </svg>
      </button>
      <button type="button" class="history-open" id="historyOpen" aria-haspopup="dialog" aria-controls="historyPanel">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4.5l3 1.6"/>
        </svg>
        <span>历史批注</span>
      </button>
    </div>
  </header>
  <div class="history-panel" id="historyPanel" role="dialog" aria-label="历史批注与版本历史" hidden>
    <div class="history-head">
      <strong>历史</strong>
      <button type="button" class="history-close" id="historyClose">关闭</button>
    </div>
    <div class="history-tabs" id="historyTabs" role="tablist" aria-label="历史">
      <button type="button" class="history-tab is-active" id="historyTabNotes" data-history-tab="notes" role="tab" aria-selected="true" aria-controls="historyNotesPanel">历史批注</button>
      <button type="button" class="history-tab" id="historyTabVersions" data-history-tab="versions" role="tab" aria-selected="false" aria-controls="historyVersionsPanel">版本历史</button>
    </div>
    <section class="history-tabpanel" id="historyNotesPanel" role="tabpanel" aria-labelledby="historyTabNotes">
      <p class="history-note" id="historyNotesNote"></p>
      <ul class="history-list" id="historyNotesList"></ul>
    </section>
    <section class="history-tabpanel" id="historyVersionsPanel" role="tabpanel" aria-labelledby="historyTabVersions" hidden>
      <p class="history-note" id="historyNote"></p>
      <ul class="history-list" id="historyList"></ul>
    </section>
  </div>
  <p class="readonly-notice" id="readonlyNotice" role="status" hidden></p>
  <div class="workspace" id="workspace">
  <div class="workbench">
    <aside class="toc-panel" id="tocPanel" aria-label="目录">
      <nav class="toc" id="toc"></nav>
    </aside>
    <main class="doc" id="blocks" aria-label="文档正文">
      <div class="paper-tools" id="paperTools" role="group" aria-label="字号">
        <button type="button" id="fontSmaller" title="字号小一点" aria-label="字号小一点">A−</button>
        <button type="button" id="fontLarger" title="字号大一点" aria-label="字号大一点">A+</button>
      </div>
    </main>
    <aside class="notes-panel" id="notesPanel" aria-label="批注">
      <header class="notes-head">
        <strong class="notes-title">批注</strong>
      </header>
      <div class="notes-body" id="notesList"></div>
      <section class="notes-compose" id="notesCompose" hidden aria-label="反馈给模型">
        <textarea id="notesComposeText" rows="3" placeholder="要模型改什么？"></textarea>
        <p class="notes-compose-error" id="notesComposeError" hidden></p>
        <div class="notes-compose-actions">
          <button type="button" class="notes-compose-cancel" id="notesComposeCancel">取消</button>
          <button type="button" class="notes-compose-submit" id="notesComposeSubmit">提交反馈</button>
        </div>
      </section>
      <footer class="notes-foot">
        <div class="notes-overall" role="group" aria-label="整页或整份反馈">
          <button type="button" class="notes-scope" id="notesOverallPage">反馈这一页</button>
          <button type="button" class="notes-scope" id="notesOverallDoc">反馈整份</button>
        </div>
        <p class="notes-hint" id="notesHint" hidden></p>
        <button type="button" class="notes-submit" id="notesSubmit" disabled>提交给模型修改</button>
      </footer>
    </aside>
  </div>
  </div>
  <div class="inline-toolbar" id="inlineToolbar" role="toolbar" aria-label="行内格式" hidden></div>
  <button type="button" class="selection-feedback" id="selectionFeedback" data-feedback-selection hidden>反馈</button>
  <script src="/vendor/marked.js"></script>
  <script src="/doc-transport.js"></script>
  <script src="/doc-identity.js"></script>
  <script src="/doc-inline.js"></script>
  <script src="/doc-drag.js"></script>
  <script src="/doc-feedback.js"></script>
  <script src="/doc-images.js"></script>
  <script src="/doc-sources.js"></script>
  <script src="/doc-notes.js"></script>
  <script src="/doc-layout.js"></script>
  <script src="/doc-workbench.js"></script>
</body>
</html>
