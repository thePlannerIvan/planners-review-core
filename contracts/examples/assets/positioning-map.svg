<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="单次剂量与场景明确度的竞争空白">
  <rect width="720" height="420" fill="#fbfaf7"/>
  <g font-family="-apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif">
    <!-- 坐标轴 -->
    <line x1="96" y1="352" x2="656" y2="352" stroke="#2f3a33" stroke-width="1.5"/>
    <line x1="96" y1="352" x2="96" y2="44" stroke="#2f3a33" stroke-width="1.5"/>
    <text x="660" y="376" font-size="14" fill="#5b665f" text-anchor="end">单次剂量 →</text>
    <text x="84" y="48" font-size="14" fill="#5b665f" text-anchor="end">场景明确度 ↑</text>

    <!-- 空白格 -->
    <rect x="112" y="64" width="232" height="128" fill="#2f6b4f" fill-opacity="0.08" stroke="#2f6b4f" stroke-dasharray="5 5" stroke-opacity="0.6"/>
    <text x="128" y="88" font-size="13" fill="#2f6b4f">空白：小剂量 × 明确场景</text>

    <!-- 现有产品 -->
    <circle cx="540" cy="120" r="54" fill="#c9b79c" fill-opacity="0.45"/>
    <text x="540" y="118" font-size="15" fill="#3d3428" text-anchor="middle">能量胶</text>
    <text x="540" y="138" font-size="12" fill="#6b5c49" text-anchor="middle">运动前后</text>

    <circle cx="548" cy="302" r="72" fill="#9aa8a0" fill-opacity="0.4"/>
    <text x="548" y="298" font-size="15" fill="#2f3a33" text-anchor="middle">500ml 功能饮料</text>
    <text x="548" y="318" font-size="12" fill="#4f5a52" text-anchor="middle">解渴 · 提神</text>

    <circle cx="214" cy="300" r="50" fill="#b9c4bd" fill-opacity="0.4"/>
    <text x="214" y="298" font-size="15" fill="#2f3a33" text-anchor="middle">小瓶保健饮</text>
    <text x="214" y="318" font-size="12" fill="#4f5a52" text-anchor="middle">功能泛化</text>

    <circle cx="236" cy="166" r="46" fill="#2f6b4f" fill-opacity="0.12" stroke="#2f6b4f" stroke-width="2"/>
    <text x="236" y="162" font-size="15" fill="#1f4a36" text-anchor="middle">150ml 节律液</text>
    <text x="236" y="182" font-size="12" fill="#2f6b4f" text-anchor="middle">下午 · 睡前</text>

    <!-- 标注 -->
    <text x="96" y="402" font-size="12" fill="#7a847c">数据来源：竞品货架与电商 SKU 盘点（2026-11-18，12 个品牌、37 个 SKU）</text>
  </g>
